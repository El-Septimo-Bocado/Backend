spring.application.name=ElSeptimoBocado

# Railway te pasa el puerto en la variable PORT
server.port=${PORT:8080}

# ====== DATASOURCE (Railway MySQL) ======
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====== JPA / HIBERNATE ======
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ====== JWT (usa variables de entorno) ======
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS}

# ====== Pepper (para las contraseñas) ======
app.pepper=${APP_PEPPER}
